name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      index:
        description: "Where to upload"
        required: true
        type: choice
        default: "pypi"
        options: ["pypi", "testpypi"]
      ref:
        description: "Git ref to build (e.g. v1.0.5). Leave empty when triggered by a tag."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      INDEX: ${{ github.event.inputs.index || 'pypi' }}
    steps:
      - name: Check out (exact ref, with full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the provided ref when run manually, otherwise the event ref (the tag).
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build twine setuptools-scm

      - name: Clean old artifacts
        run: rm -rf dist build *.egg-info

      - name: Build (sdist + wheel)
        run: python -m build

      - name: Show artifacts
        run: ls -l dist

      - name: Upload to chosen index
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ "${INDEX}" = "testpypi" ]; then
            twine upload --repository-url https://test.pypi.org/legacy/ dist/*
          else
            twine upload dist/*
          fi
