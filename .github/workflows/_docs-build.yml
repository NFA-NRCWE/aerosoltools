# Shared documentation build.
#
# This is a reusable workflow: it is never run directly, only called by
# `docs-staging.yml` (publishes to Dev-gh-pages, for review) and
# `docs-publish.yml` (publishes to gh-pages, the live site). Keeping the build
# in one place guarantees the site you review on Dev-gh-pages was produced by
# exactly the same steps as the one that goes live -- the two callers differ
# only in `publish_branch`.
#
# It can also run without publishing at all (`publish: false`), which is how the
# pull-request check validates the docs without touching either branch.

name: Docs build (reusable)

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish the built site to publish_branch."
        type: boolean
        required: true
      publish_branch:
        description: "Branch to publish the built HTML to."
        type: string
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # The example notebooks are executed at build time and read sample
          # files from tests/data/, so a full checkout is required.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        # Required by nbsphinx to convert notebook markdown cells.
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build HTML docs
        # Notebooks are re-executed here (nbsphinx_execute = "always") and any
        # notebook error aborts the build, so the published examples always
        # reflect the current API. Doctrees go outside the output directory so
        # the build cache is not published with the site.
        run: |
          python -m sphinx -b html --keep-going \
            -w sphinx-warnings.txt \
            -d /tmp/doctrees \
            docs site

      - name: Fail on documentation warnings
        # Equivalent to -W, minus one exception: Sphinx warns when a third-party
        # intersphinx inventory cannot be fetched, which is an upstream/network
        # condition rather than a defect in these docs. Sphinx logs that warning
        # without a type, so conf.py's suppress_warnings cannot filter it and it
        # has to be filtered here instead.
        run: |
          if [ ! -s sphinx-warnings.txt ]; then
            echo "No Sphinx warnings."
            exit 0
          fi
          echo "--- full Sphinx warning log ---"
          cat sphinx-warnings.txt
          grep -E "WARNING|ERROR" sphinx-warnings.txt \
            | grep -v "failed to reach any of the inventories" \
            | grep -v "not fetchable due to" > real-warnings.txt || true
          if [ -s real-warnings.txt ]; then
            echo "--- documentation warnings (treated as errors) ---"
            cat real-warnings.txt
            exit 1
          fi
          echo "Only unreachable-inventory warnings; treating build as clean."

      - name: Upload built site as an artifact
        # Lets you download and inspect the exact site a run produced, including
        # for pull-request checks that publish nothing.
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 14

      - name: Deploy to ${{ inputs.publish_branch }}
        if: inputs.publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/
          publish_branch: ${{ inputs.publish_branch }}
          # Replace the branch contents outright rather than accumulating stale
          # pages from earlier builds.
          force_orphan: true
          # peaceiris writes .nojekyll by default (enable_jekyll is false), which
          # GitHub Pages needs or it will drop the _static/ and _images/ folders.
          enable_jekyll: false
