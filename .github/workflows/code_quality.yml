name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Every version the package claims support for in pyproject.toml.
      # Keep this list and the classifiers in step.
      fail-fast: false # report all failing versions, not just the first
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: pytest

  # The desktop GUI ships as an optional extra, so the `test` job above never
  # installs PyQt5 and every GUI test skips there. This job installs the extra so
  # they actually run. One Python version is enough: the GUI has no
  # version-specific behaviour beyond what `test` already covers.
  gui:
    name: GUI (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # PyQt5's wheels link against these; without them importing QtWidgets
      # fails even under the offscreen platform. xvfb supplies a virtual
      # display -- see the note on the test step below.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install package with the gui extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pytest
      # Run under xvfb. QT_QPA_PLATFORM=offscreen alone is not enough: the GUI
      # selects matplotlib's QtAgg backend, and matplotlib refuses to load an
      # interactive backend when it detects no display, failing with
      # "Cannot load backend 'QtAgg' ... as 'headless' is currently running".
      # xvfb-run provides a DISPLAY so that check passes; Qt itself still uses
      # the offscreen platform, which the GUI tests set for themselves.
      - name: Run the full suite with the GUI available
        run: xvfb-run -a pytest -q

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    # The auto-commit step below pushes back to the PR branch, which the default
    # read-only GITHUB_TOKEN cannot do ("Permission to ... denied to
    # github-actions[bot]", exit 128).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Install the pinned versions from the dev extra rather than whatever is
      # latest: an unpinned black reformatted the source here after a release
      # the contributor did not have, and then failed pushing the result.
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (auto-fix)
        run: ruff check src tests --fix --show-fixes
      - name: Black (auto-format)
        run: black src tests
      - name: Commit changes (PRs only)
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: apply Ruff/Black auto-fixes'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
