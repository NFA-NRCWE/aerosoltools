[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosoltools"
dynamic = ["version"]
description = "Tools for loading and analyzing aerosol instrument data"
authors = [{ name = "NRCWE community" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Lower bounds are tested, not guessed: the suite is run against exactly these
# versions on Python 3.10 (the oldest supported) in CI. The previous bounds
# (pandas>=1.0, numpy>=1.20, matplotlib>=3.1) resolved to releases that predate
# Python 3.10 entirely and could not be installed at all.
dependencies = [
    # 1.5 raises "mixed datetimes and integers" building the plot_timeseries index.
    "pandas>=2.0",
    "numpy>=1.23",
    # 3.6 has no ColormapRegistry.get_cmap, used by plot_psd and the shading helper.
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "openpyxl>=3.1",
    "scipy>=1.10",
    "tqdm>=4.64",
    # 4.4 is where typing_extensions gained `override`, which the mixins import
    # as the pre-3.12 fallback.
    "typing_extensions>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black"
]
gui = [
    "PyQt5>=5.15",
]
docs = [
  "sphinx>=7.3",
  "furo>=2024.8.6",
  "myst-parser>=2.0.0",
  "sphinx-autoapi>=3.2.1",
  "sphinx-autodoc-typehints>=2.2.3",
  # Example notebooks are executed at build time (see docs/conf.py).
  # nbsphinx also needs the `pandoc` binary, installed by the docs workflow.
  "nbsphinx>=0.9",
  "ipython>=8",
  "ipykernel>=6",
  # Required by the MyST "linkify" extension enabled in docs/conf.py.
  "linkify-it-py>=2.0",
]

[project.gui-scripts]
# Windowless launcher created in the environment's Scripts/ folder on install.
aerosoltools-gui = "aerosoltools.gui:main"

[project.scripts]
# One-time helper to drop a Desktop / Start-Menu shortcut for the GUI.
aerosoltools-gui-shortcut = "aerosoltools.gui.shortcut:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"aerosoltools.gui.view" = ["*.ico"]

[tool.setuptools.exclude-package-data]
"*" = ["pytest.ini", "tests/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[project.urls]
Documentation = "https://nfa-nrcwe.github.io/aerosoltools/"
