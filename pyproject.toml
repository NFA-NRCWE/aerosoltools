[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosoltools"
dynamic = ["version"]
description = "Tools for loading and analyzing aerosol instrument data"
authors = [{ name = "NRCWE community" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=1.0",
    "numpy>=1.20",
    "matplotlib>=3.1.0",
    "tabulate>=0.8.0",
    "openpyxl",
    "scipy>=1.10",
    "tqdm>=4.0",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black"
]
gui = [
    "PyQt5>=5.15",
]
docs = [
  "sphinx>=7.3",
  "furo>=2024.8.6",
  "myst-parser>=2.0.0",
  "sphinx-autoapi>=3.2.1",
  "sphinx-autodoc-typehints>=2.2.3"
]

[project.gui-scripts]
# Windowless launcher created in the environment's Scripts/ folder on install.
aerosoltools-gui = "aerosoltools.gui:main"

[project.scripts]
# One-time helper to drop a Desktop / Start-Menu shortcut for the GUI.
aerosoltools-gui-shortcut = "aerosoltools.gui.shortcut:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"aerosoltools.gui" = ["*.ico"]

[tool.setuptools.exclude-package-data]
"*" = ["pytest.ini", "tests/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[project.urls]
Documentation = "https://nfa-nrcwe.github.io/aerosoltools/"
